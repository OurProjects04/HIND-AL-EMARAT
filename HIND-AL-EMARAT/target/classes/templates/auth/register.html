<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: header-head}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container auth-container" style="max-width: 500px; margin: 0 auto; padding-top: 80px; padding-bottom: 80px;">
    <div class="glass-card auth-card">
        <h2 class="section-title auth-title" style="font-size: 2rem; margin-bottom: 25px;">Create Account</h2>
        
        <!-- Registration Form POST mapping -->
        <form th:action="@{/register}" th:object="${user}" method="POST">
            
            <!-- Global email error -->
            <div th:if="${emailError}" class="alert alert-error" th:text="${emailError}"></div>
            <div th:if="${passwordError}" class="alert alert-error" th:text="${passwordError}"></div>

            <!-- Name split -->
            <div class="grid grid-2" style="gap: 15px;">
                <div class="form-group">
                    <label class="form-label" for="firstName">First Name</label>
                    <input type="text" th:field="*{firstName}" class="form-control" placeholder="Vikram" required>
                    <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color: #e74c3c; font-size: 0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="lastName">Last Name</label>
                    <input type="text" th:field="*{lastName}" class="form-control" placeholder="Singh" required>
                    <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color: #e74c3c; font-size: 0.8rem;"></span>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="vikram@example.com" required>
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: #e74c3c; font-size: 0.8rem;"></span>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label class="form-label" for="phone">Phone Number</label>
                <input type="tel" th:field="*{phone}" class="form-control" placeholder="9876543210">
                <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color: #e74c3c; font-size: 0.8rem;"></span>
            </div>

            <!-- Password split -->
            <div class="grid grid-2" style="gap: 15px;">
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: #e74c3c; font-size: 0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="••••••••" required>
                    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color: #e74c3c; font-size: 0.8rem;"></span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100" style="padding: 14px; margin-top: 10px;">Register</button>
        </form>
        
        <!-- Redirect link -->
        <div style="text-align: center; margin-top: 25px; font-size: 0.9rem;">
            <span class="text-muted">Already have an account? </span>
            <a th:href="@{/login}" style="color: var(--accent-gold); font-weight: 500;">Login Here</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
