# ========================
# HIND AL EMARAT - Application Properties
# ========================

spring.application.name=Hind Al Emarat
server.port=8080

# ========================
# MySQL Database Configuration
# ========================
# Change these values to match your MySQL setup:
#   - url: your database URL
#   - username: your MySQL username
#   - password: your MySQL password
# ========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hind_al_emarat_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========================
# Thymeleaf
# ========================
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}

# ========================
# File Upload
# ========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload.dir=${FILE_UPLOAD_DIR:uploads/products}

# ========================
# Logging
# ========================
logging.level.org.springframework.security=INFO
logging.level.com.hindalemarat=${APP_LOG_LEVEL:INFO}

# ========================
# Demo Seeder (disable in production)
# ========================
app.seed.enabled=${APP_SEED_ENABLED:true}
