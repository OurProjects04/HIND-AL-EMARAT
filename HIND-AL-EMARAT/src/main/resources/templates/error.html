<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIND AL EMARAT - Page Not Found / Error</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0a0a0c;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .error-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 50px 30px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #c9a84c;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .error-desc {
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-home {
            display: inline-block;
            padding: 12px 32px;
            background-color: #c9a84c;
            color: #0a0a0c;
            border-radius: 4px;
            font-weight: 500;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }
        .btn-home:hover {
            background-color: #e5c468;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="error-card">
    <div style="font-size: 4rem; color: #c9a84c;">
        <i class="fa-solid fa-compass-drafting"></i>
    </div>
    
    <h1 class="error-title">Oops! Access Denied or Error</h1>
    <p class="error-desc">We couldn't process your request. This page might have been moved, you may have insufficient administrative privileges, or the database server configuration requires adjustments.</p>
    
    <a href="/" class="btn-home">Return Home</a>
</div>

</body>
</html>
