<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: header-head}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<!-- Admin navigation subbar -->
<div style="background: var(--bg-secondary); border-bottom: 1px solid var(--border-glass); padding: 15px 0;">
    <div class="container d-flex flex-wrap gap-2">
        <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-secondary">Dashboard</a>
        <a th:href="@{/admin/products}" class="btn btn-sm btn-secondary">Products</a>
        <a th:href="@{/admin/categories}" class="btn btn-sm btn-primary">Categories</a>
        <a th:href="@{/admin/orders}" class="btn btn-sm btn-secondary">Orders</a>
        <a th:href="@{/admin/users}" class="btn btn-sm btn-secondary">Customers</a>
        <a th:href="@{/admin/messages}" class="btn btn-sm btn-secondary">Messages</a>
    </div>
</div>

<main class="container py-5">
    <!-- Header -->
    <div class="admin-dashboard-header">
        <div>
            <span class="admin-breadcrumbs"><a th:href="@{/admin/dashboard}">Dashboard</a> / Categories</span>
            <h1 style="font-family: var(--font-serif); font-size: 2.2rem;">Perfume Collections</h1>
        </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Split Panel: Create (Left) / Manage (Right) -->
    <div class="grid categories-layout">
        <!-- Add/Edit Category Form -->
        <div class="glass-card">
            <h3 style="font-family: var(--font-serif); color: var(--accent-gold); margin-bottom: 25px; border-bottom: 1px solid var(--border-glass); padding-bottom: 10px;">Add New Category</h3>
            
            <form th:action="@{/admin/categories/save}" th:object="${newCategory}" method="POST">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label class="form-label" for="name">Collection Name</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="E.g. Intense Oud Series" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Short Description</label>
                    <textarea th:field="*{description}" class="form-control" placeholder="Describe the characteristics of this collection..." required></textarea>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 25px;">
                    <input type="checkbox" th:field="*{active}" style="width: 20px; height: 20px; accent-color: var(--accent-gold); cursor: pointer;" checked>
                    <label class="form-label" for="active" style="margin: 0; cursor: pointer;">Enable Category (Active)</label>
                </div>

                <button type="submit" class="btn btn-primary w-100" style="padding: 14px;">Save Category</button>
            </form>
        </div>

        <!-- Categories Table -->
        <div class="admin-card">
            <h3 style="font-family: var(--font-serif); color: var(--accent-gold); margin-bottom: 25px; border-bottom: 1px solid var(--border-glass); padding-bottom: 10px;">Active Collections</h3>
            
            <div th:if="${#lists.isEmpty(categories)}" style="text-align: center; padding: 40px 0;">
                <p class="text-muted">No categories created yet.</p>
            </div>

            <div class="table-responsive" th:unless="${#lists.isEmpty(categories)}">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th style="text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat : ${categories}">
                            <td th:text="${cat.id}" style="color: var(--text-muted); font-size: 0.85rem;">1</td>
                            <td><strong th:text="${cat.name}" style="color: #fff;">Oud Collection</strong></td>
                            <td th:text="${cat.description}" style="font-size: 0.85rem; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Assam agarwood extracts...</td>
                            <td>
                                <span th:if="${cat.active}" class="badge badge-delivered" style="font-size: 0.65rem;">Active</span>
                                <span th:unless="${cat.active}" class="badge badge-cancelled" style="font-size: 0.65rem;">Disabled</span>
                            </td>
                            <td style="text-align: right;">
                                <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="POST" onsubmit="return confirmDelete('Are you sure you want to delete this category? Products in this category will be unassigned.');" style="display: inline;">
                                    <button type="submit" class="btn btn-danger btn-sm" style="padding: 6px 12px; cursor: pointer;"><i class="fa-solid fa-trash-can"></i></button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
