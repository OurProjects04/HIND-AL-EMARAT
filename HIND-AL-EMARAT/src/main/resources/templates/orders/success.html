<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: header-head}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container py-5" style="max-width: 600px; text-align: center;">
    <div class="glass-card animate-fadeInUp" style="padding: 50px 30px;">
        <div style="font-size: 5rem; color: #2ecc71; margin-bottom: 25px; animation: checkmark 0.8s ease-in-out;">
            <i class="fa-regular fa-circle-check"></i>
        </div>
        
        <h1 class="detail-title" style="font-size: 2.2rem; margin-bottom: 10px;">Order Placed Successfully!</h1>
        <p class="text-secondary" style="font-size: 1.05rem; margin-bottom: 30px;">Thank you for shopping with us. Your transaction is complete and our perfumers are preparing your custom delivery package.</p>
        
        <!-- Order info block -->
        <div style="background: rgba(255,255,255,0.02); border: 1px solid var(--border-glass); border-radius: 4px; padding: 20px; margin-bottom: 40px; text-align: left;">
            <div class="d-flex justify-between mb-2">
                <span class="text-muted">Order Number:</span>
                <strong th:text="${orderNumber != null ? orderNumber : 'HAE-PENDING-SAMPLE'}" style="color: var(--accent-gold); letter-spacing: 1px;">HAE-123456789</strong>
            </div>
            <div class="d-flex justify-between">
                <span class="text-muted">Estimated Delivery:</span>
                <strong>3 - 5 Business Days</strong>
            </div>
        </div>

        <!-- Call to actions -->
        <div class="d-flex flex-column gap-2">
            <a th:href="@{/orders/my-orders}" class="btn btn-primary">Track My Orders</a>
            <a th:href="@{/products}" class="btn btn-secondary">Continue Shopping</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
